<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nishant Singh's Online Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1e90ff;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .discount-banner {
            background-color: #ff4500;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .store-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        .product {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 250px;
            margin: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .product img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .product h3 {
            margin: 10px 0;
        }

        .price {
            color: #28a745;
            font-weight: bold;
        }

        .old-price {
            text-decoration: line-through;
            color: gray;
            margin-left: 8px;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #177add;
            color: white;
            position: relative;
            bottom: 0;
            width: 100%;
        }

        button {
            background-color: #1e90ff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0c6cd1;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to Nishant Singh's Online Store</h1>
        <p>Your one-stop shop for amazing deals!</p>
    </header>

    <div class="discount-banner">
        🎉 Get 20% OFF on all items! Limited Time Offer 🎉
    </div>

    <div class="store-container">
        <div class="product">
            <img src="https://via.placeholder.com/250x200" alt="Product 1">
            <h3>Stylish T-Shirt</h3>
            <p><span class="price">$16.00</span> <span class="old-price">$20.00</span></p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/250x200" alt="Product 2">
            <h3>Wireless Headphones</h3>
            <p><span class="price">$40.00</span> <span class="old-price">$50.00</span></p>
            <button>Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://via.placeholder.com/250x200" alt="Product 3">
            <h3>Smart Watch</h3>
            <p><span class="price">$80.00</span> <span class="old-price">$100.00</span></p>
            <button>Add to Cart</button>
        </div>
    </div>

    <footer>
        <p>© 2025 Nishant Singh's Online Store | All Rights Reserved</p>
    </footer>

</body>
</html>
